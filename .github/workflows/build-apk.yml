name: Build TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 本身已经装好 Android SDK，这里只是把它接管过来并放进 PATH。
      # 不调用 android-actions/setup-android，因为它会执行 `sdkmanager tools`，
      # 而 Google 已经下架了 tools 包，那一步会以退出码 1 失败。
      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          ls -1 "$SDK" || true
          CMD="$(ls -d "$SDK"/cmdline-tools/* 2>/dev/null | tail -n 1 || true)"
          echo "CMDLINE=$CMD"
          if [ -z "$CMD" ] || [ ! -x "$CMD/bin/sdkmanager" ]; then
            echo "→ 没找到可用的 cmdline-tools，下载一份"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            CMD="$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$CMD/bin" >> "$GITHUB_PATH"
          "$CMD/bin/sdkmanager" --version || true

      - name: 安装编译所需的 Android 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --list_installed | sed -n '1,40p' || true

      - name: 安装 Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'shunlu2026' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'shunlu2026' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "→ 使用仓库 Secrets 里已有的密钥"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore
          else
            echo "→ 没有密钥，本次新生成一个（跑完请立刻下载 android.keystore 保存）"
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Shunlu, OU=Demo, O=Shunlu, L=Beijing, ST=Beijing, C=CN"
          fi
          ls -lh android.keystore

      - name: 编译 APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'shunlu2026' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'shunlu2026' }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: 列出产物
        if: always()
        run: |
          ls -lh || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shunlu-apk
          if-no-files-found: warn
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
            assetlinks.json
            signing-key-info.txt
            twa-manifest.json
